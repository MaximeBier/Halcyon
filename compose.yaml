# Example deployment, versioned with the code so that the Traefik configuration
# and the served headers never drift apart.
#
# Replace `letsencrypt` with the name of the certificate resolver in place, and
# `traefik` with the name of the Traefik network if it differs.
services:
  halcyon:
    image: ghcr.io/maximebier/halcyon:latest
    container_name: halcyon
    restart: unless-stopped
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.halcyon.rule=Host(`halcyon.wardensquad.fr`)
      - traefik.http.routers.halcyon.entrypoints=websecure
      - traefik.http.routers.halcyon.tls.certresolver=letsencrypt
      - traefik.http.services.halcyon.loadbalancer.server.port=8080
      - traefik.http.services.halcyon.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.halcyon.loadbalancer.healthcheck.interval=30s

networks:
  traefik:
    external: true
