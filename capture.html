<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Halcyon — Capture</title>
    <!-- The application, not a page anyone should find from a search: empty
         without a keyboard and OBS on this machine. A meta rather than a
         robots.txt rule, because a crawler forbidden to fetch the page never
         sees the instruction not to list it, and lists the bare URL anyway. -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- What makes this page — and only this page — installable as an app.
         The overlay lives inside OBS and the home page is a brochure; the
         thing someone wants on their taskbar is the capture. -->
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/capture/main.ts"></script>
  </body>
</html>
