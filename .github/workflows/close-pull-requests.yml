name: close pull requests

# Halcyon is a single-author project and does not merge outside code — see
# CONTRIBUTING.md. Pull requests from people are closed with a pointer to the
# issues. Pull requests from Dependabot are left alone: they are how dependency
# bumps arrive, and the maintainer handles them by hand.
#
# `pull_request_target` runs in the context of the base branch, which is what
# gives GITHUB_TOKEN the right to close a pull request opened from a fork. It
# is safe here because the job never checks out or runs the pull request's
# code — it only talks to the API.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != github.repository_owner
    steps:
      - name: Close with a pointer to the issues
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          CONTRIBUTING: ${{ github.server_url }}/${{ github.repository }}/blob/main/CONTRIBUTING.md
        run: |
          gh pr comment "$PR" --body "$(cat <<MSG
          Thanks for taking the time to work on Halcyon.

          Halcyon is a single-author project and does not merge outside code — even good code. This is not about the quality of your change; it keeps the licence simple, with no contributor agreement to sign and no rights to track per commit. See [CONTRIBUTING.md]($CONTRIBUTING).

          If this fixes a bug or adds something you need, please open an issue describing it. You are welcome to paste the diff there; the fix may well land in the next release.
          MSG
          )"
          gh pr close "$PR"
